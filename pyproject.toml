[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "praca-inzynierska"
version = "1.0.0"
description = "Gotowy pipeline dla systemu kownwersji skanów w .pdf na pliki .epub"
requires-python = ">=3.12.11"

# Lista powstala z pipdeptree przy wyłączeniu torchvision, torchaudio, torch, pytorch-triton-rocm i ich zaleznosci
# Tutaj trzeba sobie samemu doinstalowac te pakiety, bo nie da sie ich zainstalowac niezaleznie od karty graficznej
dependencies = [
    "aiohttp==3.14.3",
    "beautifulsoup4==4.15.0",
    "click==8.5.0",
    "EbookLib==0.21",
    "editdistance==0.8.1",
    "hf-xet==1.6.0",
    "httpx==0.28.1",
    "multiprocess==0.70.19",
    "mwparserfromhell==0.7.2",
    "opencv-python==5.0.0.93",
    "pandas==3.0.6",
    "pip==25.0.1",
    "pyarrow==25.0.1",
    "requests==2.34.2",
    "scipy==1.18.1",
    "tqdm==4.70.0",
    "xxhash==4.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
